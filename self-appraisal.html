<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f6f78" />
  <title>Teacher Self-Appraisal</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .self-shell{max-width:900px;margin:0 auto;padding:32px 20px 56px}
    .self-card{background:rgba(255,255,255,.92);border:1px solid rgba(15,111,120,.14);border-radius:24px;padding:28px;box-shadow:0 18px 50px rgba(18,42,49,.10)}
    .self-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:24px}
    .self-kicker{margin:0 0 8px;color:#0f6f78;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem}
    .self-head h1{margin:0 0 8px;font-size:clamp(1.8rem,4vw,2.6rem)}
    .self-copy{margin:0;color:#5f6b70;max-width:640px;line-height:1.55}
    .obs-id{font-size:.82rem;color:#6c777c;background:#f3f7f7;border-radius:999px;padding:8px 12px;white-space:nowrap}
    .self-grid{display:grid;gap:16px;margin-top:24px}
    .self-item{border:1px solid rgba(15,111,120,.12);border-radius:18px;padding:18px;background:#fbfdfd}
    .self-item h2{margin:0 0 12px;font-size:1rem}
    .self-ratings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .self-ratings label{position:relative}
    .self-ratings input{position:absolute;opacity:0;pointer-events:none}
    .self-ratings span{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid #d8e2e3;border-radius:12px;background:white;font-weight:650;cursor:pointer}
    .self-ratings input:checked + span{border-color:#0f6f78;box-shadow:0 0 0 2px rgba(15,111,120,.12);background:#eef7f7}
    .self-overall{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:22px 0;padding:16px 18px;border-radius:16px;background:#f3f7f7}
    .self-overall strong{font-size:1.1rem}
    .self-comments label{display:block;font-weight:700;margin-bottom:8px}
    .self-comments textarea{width:100%;min-height:140px;border:1px solid #d6dfe1;border-radius:14px;padding:14px;font:inherit;resize:vertical}
    .self-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
    .self-status{margin:0;color:#5f6b70}
    .self-error{color:#9d2f2f}
    .self-success{color:#0f6f78;font-weight:700}
    @media(max-width:640px){
      .self-shell{padding:20px 14px 40px}
      .self-card{padding:20px}
      .self-head{display:block}
      .obs-id{display:inline-block;margin-top:14px}
      .self-ratings{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <main class="self-shell">
    <section class="self-card">
      <div class="self-head">
        <div>
          <p class="self-kicker">DAIS Formal Observation</p>
          <h1>Teacher Self-Appraisal</h1>
          <p class="self-copy">Please complete your own appraisal independently. The observer's ratings and notes are not shown on this page.</p>
        </div>
        <div id="observationIdLabel" class="obs-id"></div>
      </div>

      <form id="selfAppraisalForm">
        <div class="self-grid">
          <section class="self-item">
            <h2>Faculty Teaching Skills</h2>
            <div class="self-ratings">
              <label><input type="radio" name="teacherSelfFaculty" value="Outstanding" required><span>Outstanding</span></label>
              <label><input type="radio" name="teacherSelfFaculty" value="Acceptable"><span>Acceptable</span></label>
              <label><input type="radio" name="teacherSelfFaculty" value="Incomplete"><span>Incomplete</span></label>
            </div>
          </section>

          <section class="self-item">
            <h2>Student Learning Skills</h2>
            <div class="self-ratings">
              <label><input type="radio" name="teacherSelfLearning" value="Outstanding" required><span>Outstanding</span></label>
              <label><input type="radio" name="teacherSelfLearning" value="Acceptable"><span>Acceptable</span></label>
              <label><input type="radio" name="teacherSelfLearning" value="Incomplete"><span>Incomplete</span></label>
            </div>
          </section>

          <section class="self-item">
            <h2>Student Attainment</h2>
            <div class="self-ratings">
              <label><input type="radio" name="teacherSelfAttainment" value="Outstanding" required><span>Outstanding</span></label>
              <label><input type="radio" name="teacherSelfAttainment" value="Acceptable"><span>Acceptable</span></label>
              <label><input type="radio" name="teacherSelfAttainment" value="Incomplete"><span>Incomplete</span></label>
            </div>
          </section>

          <section class="self-item">
            <h2>Student Progress</h2>
            <div class="self-ratings">
              <label><input type="radio" name="teacherSelfProgress" value="Outstanding" required><span>Outstanding</span></label>
              <label><input type="radio" name="teacherSelfProgress" value="Acceptable"><span>Acceptable</span></label>
              <label><input type="radio" name="teacherSelfProgress" value="Incomplete"><span>Incomplete</span></label>
            </div>
          </section>
        </div>

        <div class="self-overall">
          <span>Calculated self-appraisal overall</span>
          <strong id="selfOverall">Not rated</strong>
        </div>

        <div class="self-comments">
          <label for="teacherSelfComments">Comments / reflection</label>
          <textarea id="teacherSelfComments" name="teacherSelfComments" placeholder="Add any reflection or context you would like to record..."></textarea>
        </div>

        <div class="self-actions">
          <button type="submit" class="btn btn-primary" id="selfSubmitBtn">Submit Self-Appraisal</button>
          <p id="selfStatus" class="self-status" aria-live="polite"></p>
        </div>
      </form>
    </section>
  </main>
  <script src="self-appraisal.js?v=20260923-1"></script>
</body>
</html>
